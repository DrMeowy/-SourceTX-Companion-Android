name: Build SourceTX Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SourceTX-Companion-Android-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update Pre-Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          name: "SourceTX Companion Android v0.1.0 (Preview)"
          body: |
            ## SourceTX Companion for Android (v0.1.0 Preview)
            
            - **Direct USB-C OTG** communication with ESP32-S3 transmitter.
            - **4-Action Interface**: Install, Update, Model Backup (.stxm / .stxb), Model Restore.
            - **Dark & Light Modes** with real-time theme switcher.
            
            ### Download
            Download **`SourceTX-Companion-v0.1.0-debug.apk`** below and install on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
