name: Publish Signed Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore and Environment
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" == v* ]]; then
            version="${RELEASE_TAG#v}"
          else
            version=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            RELEASE_TAG="v${version}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using repository release keystore secret."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          elif [ -f "sourcetx-release.jks" ]; then
            echo "Using permanent repository release keystore."
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/sourcetx-release.jks" >> "$GITHUB_ENV"
          else
            echo "Decoding embedded permanent release keystore."
            cat << 'EOF' | base64 --decode > release-keystore.jks

EOF
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PASSWORD=sourcetxcompanion" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=sourcetx" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=sourcetxcompanion" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace --no-daemon

      - name: Verify signature and prepare release assets
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          apk="SourceTX-Companion-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$source_apk"
          cp "$source_apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Publish immutable signed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${RELEASE_TAG}..."
            gh release upload "${RELEASE_TAG}" "$APK_PATH" "$APK_PATH.sha256" --clobber
            gh release edit "${RELEASE_TAG}" --latest
          else
            echo "Creating new release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" "$APK_PATH" "$APK_PATH.sha256" --generate-notes --latest
          fi

      - name: Remove decoded signing key
        if: always()
        run: rm -f release-keystore.jks
